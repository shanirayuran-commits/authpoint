<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthPoint - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --surface: #111111;
            --border: #333333;
            --primary: #ffffff;
            --text-main: #ffffff;
            --text-muted: #888888;
            --success: #4ade80;
            --error: #f87171;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-size: 14px;
        }

        .navbar {
            width: 80%;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            box-sizing: border-box;
        }

        .nav-logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 0.8rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: #0a0a0a;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
            border-color: #555555;
            background: #111111;
        }

        .nav-links a.active {
            color: #000000;
            background: var(--primary);
            border-color: var(--primary);
        }

        .container {
            width: 80%;
            padding: 2rem;
            box-sizing: border-box;
            background: var(--surface);
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.35rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-content {
            max-width: 450px;
            margin: 0 auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 0.8rem;
        }

        label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            background: #050505;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.75rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .password-requirements {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.45rem;
            line-height: 1.5;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin: 0.3rem 0;
        }

        .requirement-check {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #333333;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.6rem;
            font-size: 0.6rem;
        }

        .requirement.met .requirement-check {
            background: var(--success);
            color: #000000;
        }

        button {
            width: 100%;
            padding: 0.6rem 1.2rem;
            background: var(--primary);
            color: #000000;
            border: none;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            margin-top: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #cccccc;
        }

        button:disabled {
            background: #555555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #msg {
            margin-top: 0.8rem;
            font-size: 0.75rem;
            text-align: center;
            font-weight: 500;
            min-height: 20px;
        }

        .link-text {
            text-align: center;
            margin-top: 1.35rem;
            font-size: 0.81rem;
            color: var(--text-muted);
        }

        .link-text a {
            color: var(--primary);
            text-decoration: none;
        }

        .link-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-logo">AuthPoint</div>
        <div class="nav-links" id="navLinks">
            <a href="/views/register.html" class="active">Register</a>
            <a href="/views/login.html">Login</a>
        </div>
    </div>

    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Sign up for AuthPoint to get started</p>

        <div class="form-content">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" />
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" />
                <div class="password-requirements">
                    <div class="requirement" id="req-length">
                        <div class="requirement-check">✓</div>
                        At least 8 characters
                    </div>
                    <div class="requirement" id="req-upper">
                        <div class="requirement-check">✓</div>
                        One uppercase letter
                    </div>
                    <div class="requirement" id="req-number">
                        <div class="requirement-check">✓</div>
                        One number
                    </div>
                    <div class="requirement" id="req-special">
                        <div class="requirement-check">✓</div>
                        One special character (!@#$%^&*)
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" placeholder="••••••••" />
            </div>
            
            <button id="registerBtn" onclick="register()" disabled>
                Create Account
            </button>
            <p id="msg"></p>

            <div class="link-text">
                Already have an account? <a href="/views/login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // Check login status on page load
        function checkLoginStatus() {
            const token = localStorage.getItem('sessionToken');
            const navLinks = document.getElementById('navLinks');
            
            if (token) {
                window.location.href = '/views/dashboard.html';
            }
        }
        
        function logout() {
            localStorage.removeItem('sessionToken');
            window.location.href = '/views/login.html';
        }

        window.addEventListener('load', checkLoginStatus);
    </script>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');
        const registerBtn = document.getElementById('registerBtn');

        function validatePassword(pwd) {
            const hasLength = pwd.length >= 8;
            const hasUpper = /[A-Z]/.test(pwd);
            const hasNumber = /[0-9]/.test(pwd);
            const hasSpecial = /[!@#$%^&*]/.test(pwd);
            
            document.getElementById('req-length').classList.toggle('met', hasLength);
            document.getElementById('req-upper').classList.toggle('met', hasUpper);
            document.getElementById('req-number').classList.toggle('met', hasNumber);
            document.getElementById('req-special').classList.toggle('met', hasSpecial);

            return hasLength && hasUpper && hasNumber && hasSpecial;
        }

        passwordInput.addEventListener('input', (e) => {
            const isValid = validatePassword(e.target.value);
            updateButtonState();
        });

        confirmInput.addEventListener('input', updateButtonState);

        function updateButtonState() {
            const email = document.getElementById('email').value.trim();
            const pwd = passwordInput.value;
            const confirm = confirmInput.value;
            const isValid = validatePassword(pwd) && pwd === confirm && email.length > 0;
            registerBtn.disabled = !isValid;
        }

        async function register() {
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const msgEl = document.getElementById('msg');
            const btn = document.getElementById('registerBtn');

            if (!email || !password) {
                msgEl.style.color = '#f87171';
                msgEl.textContent = 'Email and password required.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'CREATING ACCOUNT...';
            
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    msgEl.style.color = '#4ade80';
                    msgEl.textContent = '✓ Account created! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = '/views/login.html';
                    }, 1500);
                } else {
                    msgEl.style.color = '#f87171';
                    msgEl.textContent = data.error || 'Registration failed.';
                    btn.disabled = false;
                    btn.textContent = 'CREATE ACCOUNT';
                }
            } catch (err) {
                msgEl.style.color = '#f87171';
                msgEl.textContent = 'Error during registration.';
                btn.disabled = false;
                btn.textContent = 'CREATE ACCOUNT';
            }
        }
    </script>
</body>
</html>
